global:
  scrape_interval: 15s

scrape_configs:

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8081']

  - job_name: 'movie-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['movie-service:8082']

  - job_name: 'theatre-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['theatre-service:8085']

  - job_name: 'show-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['show-service:8086']

  - job_name: 'booking-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['booking-service:8087']

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:8089']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']