services:


  #zipkin
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped

  # =========================================================
  # POSTGRESQL
  # =========================================================

  postgres:
    image: postgres:17
    container_name: cinehub-postgres

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    restart: unless-stopped


  # =========================================================
  # REDIS
  # =========================================================

  redis:
    image: redis:7-alpine
    container_name: cinehub-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    restart: unless-stopped


  # =========================================================
  # KAFKA
  # =========================================================

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    restart: unless-stopped


  # =========================================================
  # KAFKA TOPIC INITIALIZER
  # =========================================================

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: kafka-init

    depends_on:
      - kafka

    entrypoint: ["/bin/bash", "-c"]

    command: >
      "
      echo 'Waiting for Kafka...';

      until /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --list > /dev/null 2>&1;
      do
        sleep 2;
      done;

      echo 'Kafka is ready.';

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic payment-requested
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic payment-succeeded
      --partitions 3
      --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic payment-failed
      --partitions 3
      --replication-factor 1;

      echo 'Kafka topics created';

      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --list;
      "


  # =========================================================
  # EUREKA
  # =========================================================

  eureka-server:
    build:
      context: ./eureka-server

    container_name: eureka-server

    ports:
      - "8761:8761"

    restart: unless-stopped


  # =========================================================
  # AUTH SERVICE
  # =========================================================

  auth-service:
    build:
      context: ./auth-service

    container_name: auth-service

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres


      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    env_file:
      - ./.env

    depends_on:
      - postgres
      - eureka-server

    restart: unless-stopped


  # =========================================================
  # MOVIE SERVICE
  # =========================================================

  movie-service:
    build:
      context: ./movie-service

    container_name: movie-service

    ports:
      - "8082:8082"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/movie_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres


      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    env_file:
      - ./.env

    depends_on:
      - postgres
      - eureka-server

    restart: unless-stopped


  # =========================================================
  # THEATRE SERVICE
  # =========================================================

  theatre-service:
    build:
      context: ./theatre-service

    container_name: theatre-service

    ports:
      - "8085:8085"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/theatre_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres


      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    env_file:
      - ./.env

    depends_on:
      - postgres
      - eureka-server

    restart: unless-stopped


  # =========================================================
  # SHOW SERVICE
  # =========================================================

  show-service:
    build:
      context: ./show-service

    container_name: show-service

    ports:
      - "8086:8086"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/show_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres


      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    env_file:
      - ./.env

    depends_on:
      - postgres
      - eureka-server

    restart: unless-stopped


  # =========================================================
  # BOOKING SERVICE
  # =========================================================

  booking-service:
    build:
      context: ./booking-service

    container_name: booking-service

    ports:
      - "8087:8087"

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres


      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    env_file:
      - ./.env

    depends_on:
      - postgres
      - redis
      - kafka
      - kafka-init
      - eureka-server

    restart: unless-stopped


  # =========================================================
  # PAYMENT SERVICE
  # =========================================================

  payment-service:
    build:
      context: ./payment-service

    container_name: payment-service

    ports:
      - "8089:8089"

    environment:
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}


      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    env_file:
      - ./.env

    depends_on:
      - postgres
      - kafka
      - kafka-init
      - eureka-server

    restart: unless-stopped


  # =========================================================
  # API GATEWAY
  # =========================================================

  api-gateway:
    build:
      context: ./api-gateway

    container_name: api-gateway

    ports:
      - "8080:8080"

    environment:

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    env_file:
      - ./.env

    depends_on:
      - eureka-server
      - auth-service
      - movie-service
      - theatre-service
      - show-service
      - booking-service
      - payment-service

    restart: unless-stopped


  # =========================================================
  # REACT FRONTEND
  # =========================================================

  frontend:
    build:
      context: ./cinehubReact
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1

    container_name: cinehub-frontend

    ports:
      - "3000:80"

    depends_on:
      - api-gateway

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: cinehub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: cinehub-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
# =========================================================
# VOLUMES
# =========================================================

volumes:

  postgres_data:
  grafana_data:
  redis_data: