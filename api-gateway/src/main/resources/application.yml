server:
  port: 8080
jwt:
  secretKey: mySuperSecretKeyThatIsVeryLongForHS256
spring:
  application:
    name: api-gateway



  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - AuthenticationFilter


            - id: movie-service
              uri: lb://MOVIE-SERVICE
              predicates:
              - Path=/api/v1/public/movies/**, /api/v1/admin/movies/**
              filters:
                  - AuthenticationFilter


            - id: theatre-service
              uri: lb://THEATRE-SERVICE
              predicates:
                - Path=/api/v1/theatre_owner/** , /api/v1/owner/**, /api/v1/admin/** ,/api/v1/screens/**
              filters:
                - AuthenticationFilter


            - id: show-service
              uri: lb://SHOW-SERVICE
              predicates:
                - Path=/api/v1/shows/**, /api/v1/public/shows/**
              filters:
                - AuthenticationFilter


            - id: booking-service
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/api/v1/bookings/**
              filters:
                - AuthenticationFilter


            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payment/**
              filters:
                - AuthenticationFilter


          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

