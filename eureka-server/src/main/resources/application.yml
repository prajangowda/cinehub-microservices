server:
  port: 8761

eureka:
  client:

    register-with-eureka: false
    fetch-registry: false
  server:

    enable-self-preservation: false


management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
